name: Live-market paper test
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes per segment (1–300; overnight uses two segments)"
        default: "240"
        required: true
      overnight:
        description: "Run two consecutive segments with the same balances (8 hours by default)"
        type: boolean
        default: true
      strategy:
        description: "Paper strategy"
        type: choice
        options: [guarded]
        default: guarded
      universe:
        description: "Discovered WETH pools, or USDG-only control"
        type: choice
        options: [discovered, tokens]
        default: discovered
      capitals:
        description: "Independent virtual ETH balances (1–3 amounts, each up to 0.5 ETH)"
        default: "0.1,0.5"
        required: true
permissions:
  contents: write
concurrency:
  group: live-market-paper-test
  cancel-in-progress: false
jobs:
  first-half:
    uses: ./.github/workflows/paper-segment.yml
    with:
      duration: ${{ inputs.duration_minutes || '240' }}
      strategy: ${{ inputs.strategy || 'guarded' }}
      capitals: ${{ inputs.capitals || '0.1,0.5' }}
      universe: ${{ inputs.universe || 'discovered' }}
      segment: 1
      segments: ${{ (github.event_name == 'schedule' || inputs.overnight) && 2 || 1 }}
  second-half:
    needs: first-half
    if: github.event_name == 'schedule' || inputs.overnight
    uses: ./.github/workflows/paper-segment.yml
    with:
      duration: ${{ inputs.duration_minutes || '240' }}
      strategy: ${{ inputs.strategy || 'guarded' }}
      capitals: ${{ inputs.capitals || '0.1,0.5' }}
      universe: ${{ inputs.universe || 'discovered' }}
      segment: 2
      segments: 2

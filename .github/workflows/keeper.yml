name: Keeper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: perch-production-keeper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call production keeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Add CRON_SECRET to the repository Actions secrets, using the same value as Vercel Production.'
            exit 1
          fi
          response_file="$RUNNER_TEMP/keeper-response.json"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output "$response_file" \
            https://reef-mist-pepper-cobalt.vercel.app/api/degen/tick
          if ! jq -e '(.ok == true) or (.skipped == true)' "$response_file" > /dev/null; then
            echo '::error::The keeper returned an unsuccessful or invalid response. Check Vercel runtime logs and /api/degen/status.'
            exit 1
          fi
          echo 'Keeper request succeeded.'
